# netlify.toml

# Send the default Netlify domain to the primary domain before other rules.
[[redirects]]
  from = "https://acutabovetest.netlify.app/*"
  to = "https://acutabovemeats.co.zw/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://acutabovetest.netlify.app/*"
  to = "https://acutabovemeats.co.zw/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://a-cut-above-backend-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://a-cut-above-backend-production.up.railway.app/uploads/:splat"
  status = 200
  force = true

# Consolidate duplicate shop and tracking addresses.
[[redirects]]
  from = "/products"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/shop"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/track-order"
  to = "/track"
  status = 301
  force = true

# Every known route has its own generated HTML; unknown admin routes stay noindex.
[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200

# Unknown URLs must return a real 404, rather than an indexable empty SPA shell.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
